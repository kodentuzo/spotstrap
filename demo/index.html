<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spotstrap demo</title>
    <link rel="stylesheet" href="../dist/spotstrap.css" />
    <link rel="stylesheet" id="theme" href="../dist/themes/neutral.css" />
    <style>
      body { margin: 0; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 3rem max(1rem, env(safe-area-inset-left)); }
      main { max-width: 48rem; margin-inline: auto; display: grid; gap: 2rem; }
      section { display: grid; gap: var(--gap-control); }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-control); }
      h1, h2 { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <header class="row">
        <h1 class="text-large-title">Spotstrap</h1>
        <label class="row">
          <span class="text-subhead">Theme</span>
          <select id="theme-picker" class="select">
            <option>neutral</option>
            <option>kodentuzo</option>
            <option>librevitalis</option>
            <option>librelifts</option>
            <option>spotcraft</option>
            <option>sokobanko</option>
            <option>tagtape</option>
            <option>vinskiano</option>
          </select>
        </label>
      </header>

      <section id="buttons">
        <h2 class="text-title-2">Button</h2>
        <div class="row">
          <button type="button" class="btn" data-control>Save</button>
          <button type="button" class="btn btn-secondary" data-control>Duplicate</button>
          <button type="button" class="btn btn-outline" data-control>Export…</button>
          <button type="button" class="btn btn-ghost" data-control>Cancel</button>
          <button type="button" class="btn btn-link" data-control>Learn more</button>
          <button type="button" class="btn btn-destructive" data-control>Delete</button>
        </div>
        <div class="row">
          <button type="button" class="btn btn-compact" data-control>Save</button>
          <button type="button" class="btn btn-outline btn-compact" data-control>Filter</button>
          <button type="button" class="btn btn-icon btn-outline" data-control aria-label="Add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button type="button" class="btn btn-icon btn-ghost btn-compact" data-control aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
          <a class="btn btn-secondary" href="#buttons" data-control>Link button</a>
        </div>
        <div class="row">
          <button type="button" class="btn" aria-busy="true" data-control>Saving…</button>
          <button type="button" class="btn btn-outline" disabled>Disabled</button>
        </div>
      </section>

      <section id="fields">
        <h2 class="text-title-2">Fields</h2>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" data-control />
          <p class="field-description">We send the sign-in link here.</p>
        </div>
        <div class="field">
          <label class="label" for="handle">Username</label>
          <input class="input" id="handle" value="ad" aria-invalid="true" aria-describedby="handle-error" data-control />
          <p class="field-error" id="handle-error">Use at least 3 characters.</p>
        </div>
        <div class="field">
          <label class="label" for="notes">Notes</label>
          <textarea class="textarea" id="notes" data-control></textarea>
        </div>
        <div class="field">
          <label class="label" for="plan">Plan</label>
          <select class="select" id="plan" data-control>
            <option>Free</option>
            <option>Pro</option>
            <option>Team</option>
          </select>
        </div>
        <fieldset class="fieldset">
          <legend class="legend">Shipping</legend>
          <div class="field">
            <label class="label" for="zip">Postal code</label>
            <input class="input" id="zip" inputmode="numeric" autocomplete="postal-code" data-control />
          </div>
          <div class="field">
            <label class="label" for="locked">Country</label>
            <input class="input" id="locked" value="Croatia" disabled />
          </div>
        </fieldset>
      </section>
    </main>
    <script>
      document.getElementById('theme-picker').addEventListener('change', (e) => {
        document.getElementById('theme').href = `../dist/themes/${e.target.value}.css`
      })
    </script>
  </body>
</html>
