# Supply chain, written out explicitly so a change of pnpm defaults can't
# quietly weaken them: releases install only once they're a day old,
# provenance can't be downgraded, transitive deps can't come from git or
# tarball URLs, and no package may run install scripts unless listed.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true

# esbuild installs its platform binary in a postinstall script.
allowBuilds:
  esbuild: true
