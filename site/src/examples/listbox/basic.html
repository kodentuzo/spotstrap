<div class="field max-w-xs" data-spotstrap="listbox" data-name="size">
  <span class="label" data-part="label">Size</span>
  <button type="button" class="select" data-part="trigger">
    <span data-part="value-text" data-placeholder="Pick a size"></span>
  </button>
  <div class="menu" data-part="content">
    <div class="menu-item" data-part="item" data-value="s">Small</div>
    <div class="menu-item" data-part="item" data-value="m" data-selected>Medium</div>
    <div class="menu-item" data-part="item" data-value="l">Large</div>
    <div class="menu-item" data-part="item" data-value="xl" data-disabled>Extra large</div>
  </div>
</div>
