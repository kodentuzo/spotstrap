<div class="grid max-w-sm gap-4">
  <div class="field">
    <label class="label" for="email">Email</label>
    <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    <p class="field-description">We send the sign-in link here.</p>
  </div>
  <div class="field">
    <label class="label" for="handle">Username</label>
    <input class="input" id="handle" value="ad" aria-invalid="true" aria-describedby="handle-error" />
    <p class="field-error" id="handle-error">Use at least 3 characters.</p>
  </div>
</div>
