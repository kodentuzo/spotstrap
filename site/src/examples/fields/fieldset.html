<fieldset class="fieldset max-w-sm">
  <legend class="legend">Shipping</legend>
  <div class="field">
    <label class="label" for="zip">Postal code</label>
    <input class="input" id="zip" inputmode="numeric" autocomplete="postal-code" />
  </div>
  <div class="field">
    <label class="label" for="country">Country</label>
    <input class="input" id="country" value="Croatia" disabled />
  </div>
</fieldset>
