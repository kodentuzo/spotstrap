<div class="field max-w-xs" data-spotstrap="combobox" data-name="country">
  <label class="label" data-part="label" for="country-input">Country</label>
  <div data-part="control">
    <input class="input" id="country-input" data-part="input" placeholder="Start typing" />
  </div>
  <div class="menu" data-part="content">
    <div class="menu-item" data-part="item" data-value="at">Austria</div>
    <div class="menu-item" data-part="item" data-value="hr">Croatia</div>
    <div class="menu-item" data-part="item" data-value="de">Germany</div>
    <div class="menu-item" data-part="item" data-value="it">Italy</div>
    <div class="menu-item" data-part="item" data-value="si">Slovenia</div>
    <div class="menu-empty" data-part="empty" hidden>No country matches.</div>
  </div>
</div>
